name: Release

on:
  push:
    branches:
      - main
    paths:
      - version
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $versionPath = "version"
          if (-not (Test-Path -LiteralPath $versionPath)) {
            throw "version file not found"
          }
          $version = [string](Get-Content -LiteralPath $versionPath -Raw)
          $version = $version.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "version must contain three numeric parts, for example 0.2.0."
          }
          $tag = "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Check tag
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $existing = git ls-remote --tags origin "refs/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw "git ls-remote failed" }
          if ($existing) { throw "Tag $env:TAG already exists. Bump version." }

  test:
    needs: preflight
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        shell: pwsh
        run: .\test.ps1

  build_x64:
    needs:
      - preflight
      - test
    uses: ./.github/workflows/build_x64.yml

  build_x32:
    needs:
      - preflight
      - test
    uses: ./.github/workflows/build_x32.yml

  publish:
    needs:
      - preflight
      - build_x64
      - build_x32
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: etsu-x64-${{ needs.preflight.outputs.version }}
          path: artifacts/x64

      - uses: actions/download-artifact@v4
        with:
          name: etsu-x86-${{ needs.preflight.outputs.version }}
          path: artifacts/x86

      - name: Build release assets
        shell: pwsh
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = "release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          function Assert-Checksum([string]$ChecksumPath, [string]$InstallerPath) {
            if (-not (Test-Path $ChecksumPath)) { throw "Missing checksum file: $ChecksumPath" }
            if (-not (Test-Path $InstallerPath)) { throw "Missing installer: $InstallerPath" }
            $parts = (Get-Content $ChecksumPath -Raw).Trim() -split '\s+', 2
            if ($parts.Count -ne 2 -or $parts[1] -ne (Split-Path $InstallerPath -Leaf)) {
              throw "Checksum file does not reference $InstallerPath"
            }
            $actual = (Get-FileHash $InstallerPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $parts[0]) { throw "Checksum does not match $InstallerPath" }
          }

          $x64 = "artifacts/x64/v${env:VERSION}_installer_x64.exe"
          $x86 = "artifacts/x86/v${env:VERSION}_installer_x86.exe"
          Assert-Checksum "artifacts/x64/SHA256SUMS_x64.txt" $x64
          Assert-Checksum "artifacts/x86/SHA256SUMS_x86.txt" $x86

          Copy-Item $x64 $releaseDir
          Copy-Item $x86 $releaseDir

          $lines = foreach ($installer in @($x64, $x86)) {
            $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($installer))"
          }
          $lines | Set-Content (Join-Path $releaseDir "SHA256SUMS.txt") -Encoding ascii

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $assets = @(Get-ChildItem "release" -File | ForEach-Object { $_.FullName })
          gh release create $env:TAG @assets `
            --draft --target $env:GITHUB_SHA --title $env:TAG `
            --notes "ETSU $env:TAG`n`nIncludes x64 and x86 installers."
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
