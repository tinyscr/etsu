name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        shell: pwsh
        run: .\test.ps1

      - name: Build installer
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid tag '$($env:TAG)'. Use vMAJOR.MINOR.PATCH."
          }
          $version = $env:TAG.Substring(1)

          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed" }
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup compiler not found" }

          .\build.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed" }

          $setup = "dist/v${version}_installer.exe"
          if (-not (Test-Path $setup)) { throw "Setup exe was not built" }

          $checksums = "dist/SHA256SUMS.txt"
          if (-not (Test-Path $checksums)) { throw "SHA256SUMS.txt was not built" }

          $checksumParts = (Get-Content $checksums -Raw).Trim() -split '\s+', 2
          if ($checksumParts.Count -ne 2 -or $checksumParts[1] -ne (Split-Path $setup -Leaf)) {
            throw "SHA256SUMS.txt does not reference the installer"
          }
          $actual = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $checksumParts[0]) { throw "SHA256SUMS.txt does not match the installer" }

          "SETUP=$setup" >> $env:GITHUB_ENV
          "CHECKSUMS=$checksums" >> $env:GITHUB_ENV

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release create $env:TAG $env:SETUP $env:CHECKSUMS `
            --draft --target $env:GITHUB_SHA --title $env:TAG --notes "etsu $env:TAG"
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
