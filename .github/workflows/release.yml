name: Release

on:
  push:
    branches:
      - main
    paths:
      - version
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $versionPath = "version"
          if (-not (Test-Path -LiteralPath $versionPath)) {
            throw "version file not found"
          }
          $version = [string](Get-Content -LiteralPath $versionPath -Raw)
          $version = $version.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "version must contain three numeric parts, for example 0.2.0."
          }
          $tag = "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Check tag
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $existing = git ls-remote --tags origin "refs/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw "git ls-remote failed" }
          if ($existing) { throw "Tag $env:TAG already exists. Bump version." }

      - name: Run tests
        shell: pwsh
        run: .\test.ps1

      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed" }
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup compiler not found" }

          .\build.ps1
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed" }

          $setup = "dist/v${env:VERSION}_installer.exe"
          if (-not (Test-Path $setup)) { throw "Setup exe was not built" }

          $checksums = "dist/SHA256SUMS.txt"
          if (-not (Test-Path $checksums)) { throw "SHA256SUMS.txt was not built" }

          $checksumParts = (Get-Content $checksums -Raw).Trim() -split '\s+', 2
          if ($checksumParts.Count -ne 2 -or $checksumParts[1] -ne (Split-Path $setup -Leaf)) {
            throw "SHA256SUMS.txt does not reference the installer"
          }
          $actual = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $checksumParts[0]) { throw "SHA256SUMS.txt does not match the installer" }

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $setup = "dist/v${env:VERSION}_installer.exe"
          $checksums = "dist/SHA256SUMS.txt"
          gh release create $env:TAG $setup $checksums `
            --draft --target $env:GITHUB_SHA --title $env:TAG --notes "ETSU $env:TAG"
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
