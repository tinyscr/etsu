name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          go build -trimpath -ldflags "-s -w" -o bin/etsu.exe ./cmd/etsu
          if ($LASTEXITCODE -ne 0) { throw "go build failed" }
          if (-not (Test-Path "bin/etsu.exe")) { throw "etsu.exe was not built" }

      - name: Build installer
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid tag '$($env:TAG)'. Use vMAJOR.MINOR.PATCH."
          }
          $version = $env:TAG.Substring(1)

          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed" }
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup compiler not found" }

          New-Item -ItemType Directory dist -Force | Out-Null
          & $iscc "/DAppVersion=$version" "installer\etsu.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

          $setup = "dist/etsu-setup-$version.exe"
          if (-not (Test-Path $setup)) { throw "Setup exe was not built" }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  etsu-setup-$version.exe" | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii
          "SETUP=$setup" >> $env:GITHUB_ENV

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release create $env:TAG $env:SETUP "dist/SHA256SUMS.txt" `
            --draft --target $env:GITHUB_SHA --title $env:TAG --notes "etsu $env:TAG"
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
